# .maw/config.yaml — generated by `/maw:init` from generic profile.
# Used when stack-detection finds no recognized manifest. The operator fills in
# stack/deploy fields after init; alternatively re-run /maw:init when
# manifests land.

maw:
  plugin_version: "{{plugin_version}}"
  schema_version: 1
  profile: "generic"
  repo_id: "{{repo_id}}"

stack:
  language: ""
  package_manager: ""
  venv_path: ""
  test_command: ""
  run_command: ""

deploy:
  target: "none"
  url: ""
  preserve_dev_after_merge: true

branches:
  protected: "main"
  development: "dev"
  feature_pattern: "feature/*"
  fix_pattern: "fix/*"
  improve_pattern: "improve/*"

push_gate:
  marker_env: "MAW_HUMAN"
  always_block_branches: ["main", "master"]
  always_allow_branches: ["dev", "feature/*", "fix/*", "improve/*"]

budget:
  soft_warn_at: 600
  hard_block_at: 1500
  tool_call_cap_per_session: 2000

live_sweep:
  enabled: false
  prod_url: ""
  credentials_source: ""
  read_only_targets: []
  write_targets: []

bridge:
  dir: "~/.claude/bridge/{{repo_slug}}"
  repo_slug: "{{repo_slug}}"
  push_notification: true
  loop_poll_minutes: 5
  file_acl: "0600"
  max_turn_body_kb: 64
  rotate_at_unconsumed_turns: 10
  rotate_at_dir_size_mb: 500

trust_ramp:
  enabled: false
  state_file: "~/.maw/trust-ramp.json"

# Template files this profile installs into the target repo's .claude/.
# /maw:init walks these lists, copies each from maw/init/templates/<rel-path>,
# and renders placeholders against the merged variables dict
# (substitution.py grammar). Paths are relative to maw/init/templates/.
# Generic profile installs the universal substrate gates but skips the
# findings/-doctrine hooks — a brand-new generic-stack repo may not have
# adopted that doctrine yet. Opt in by appending hooks/check-ext-data.sh
# and hooks/check-forbidden-lang.sh once findings/ exists.
# Repo-local Claude Code hook scripts (budget-guard, depth-guard, scan-args,
# validate-launch, check-ext-data, check-forbidden-lang) are OPT-IN and not
# installed by default: a hook file only runs once it is registered in the
# repo's .claude/settings.json, and these gate every tool call or agent spawn.
# To adopt one, list it here (e.g. `- hooks/depth-guard.py`) and register it in
# .claude/settings.json yourself. The plugin's own hooks (switchboard, guards)
# load with the plugin and need nothing here.
hooks: []

git_hooks:
  - git-hooks/pre-push

schemas:
  - schemas/handoff.json

# Concrete values for placeholders in the files listed above. /maw:init
# merges these with the maw/* and bridge/* values it derives at init time
# to build the substitution dict.
template_vars:
  budget_soft: "600"
  budget_hard: "1500"
  deploy_branch: "main"
  alias_suggestion: "mw"
  live_sweep_cred_const: "env:MY_ADMIN_USER,MY_ADMIN_PASS"
